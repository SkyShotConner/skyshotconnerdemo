<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>SkyShotConner | Shop Orders</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<style>
:root{--bg:#060a0f;--panel:#0e151d;--panel2:#151f2a;--text:#f5f9fd;--muted:#8e9cab;--accent:#55b8ff;--ok:#55df8b;--warn:#ffd166;--danger:#ff7474;--line:rgba(255,255,255,.09)}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0%,rgba(45,130,190,.1),transparent 28%),var(--bg);color:var(--text);font:14px Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.hidden{display:none!important}.login{width:min(430px,calc(100% - 28px));margin:10vh auto;padding:30px;background:linear-gradient(180deg,var(--panel),#0b1118);border:1px solid var(--line);border-radius:22px}.login h1{margin:0 0 8px}.input,select,textarea{width:100%;padding:12px 13px;background:#080e14;color:#fff;border:1px solid var(--line);border-radius:10px;outline:0}.btn{border:1px solid var(--line);background:var(--panel2);color:#fff;padding:10px 13px;border-radius:10px;cursor:pointer;font-weight:800;min-height:42px}.btn.primary{background:var(--accent);color:#06111a;border-color:var(--accent)}.app{display:none;min-height:100vh}.bar{position:sticky;top:0;z-index:10;background:rgba(6,10,15,.9);backdrop-filter:blur(18px);border-bottom:1px solid var(--line);padding:14px 24px;display:flex;align-items:center;gap:14px}.brand{font-weight:950;letter-spacing:2px;margin-right:auto}.brand span{color:var(--accent)}.wrap{max-width:1500px;margin:auto;padding:28px 24px 60px}.top{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;margin-bottom:22px}.top h1{margin:0;font-size:clamp(1.7rem,3vw,2.5rem)}.muted{color:var(--muted)}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card,.panel{background:linear-gradient(180deg,var(--panel),#0b1219);border:1px solid var(--line);border-radius:16px}.card{padding:18px}.card small{display:block;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:1px;font-weight:900}.card strong{font-size:28px;display:block;margin-top:7px}.panel{padding:18px;margin-top:18px}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:15px}.toolbar .input{max-width:320px}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:850px}.table th,.table td{padding:12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}.table th{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1px}.pill{display:inline-block;padding:5px 8px;border-radius:999px;background:#172431;font-size:10px;font-weight:900}.paid{color:var(--ok)}.pending{color:var(--warn)}.failed,.cancelled{color:var(--danger)}.fulfil{color:#bfe3ff}.rowbtn{min-height:34px;padding:7px 10px;font-size:11px}.modal{display:none;position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.82);padding:20px;overflow:auto}.modalbox{width:min(900px,100%);margin:3vh auto;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px}.modalhead{display:flex;justify-content:space-between;gap:15px}.modalhead h2{margin:0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field label{display:block;font-size:10px;color:var(--muted);font-weight:900;text-transform:uppercase;letter-spacing:1px;margin-bottom:5px}.full{grid-column:1/-1}.section{margin-top:20px;padding-top:16px;border-top:1px solid var(--line)}.items{width:100%;border-collapse:collapse}.items td{padding:8px;border-bottom:1px solid var(--line)}.timeline{border-left:2px solid rgba(85,184,255,.25);padding-left:14px}.event{margin:0 0 14px}.event strong{display:block}.event small{color:var(--muted)}.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}.notice{padding:11px;border:1px solid rgba(85,184,255,.18);background:rgba(85,184,255,.06);border-radius:10px;color:#bfe3ff}.error{color:#ffaaaa;margin-top:10px}@media(max-width:850px){.cards{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.full{grid-column:auto}}@media(max-width:600px){.bar{padding:12px}.wrap{padding:18px 10px 45px}.top{flex-direction:column}.cards{gap:8px}.card{padding:13px}.card strong{font-size:22px}.toolbar>*{width:100%;max-width:none!important}.modal{padding:0}.modalbox{margin:auto 0 0;width:100%;max-height:94vh;border-radius:18px 18px 0 0;padding:15px}.actions{position:sticky;bottom:-15px;padding:12px 0 0;background:var(--panel)}}
</style></head>
<body>
<div id="login" class="login"><div class="muted" style="font-size:10px;font-weight:900;letter-spacing:1px;text-transform:uppercase;margin-bottom:14px">Secure administrator access</div><h1>Shop Orders</h1><p class="muted">Sign in with the authorised SkyShotConner administrator account.</p><input id="email" class="input" type="email" placeholder="Admin email" autocomplete="username"><br><br><input id="password" class="input" type="password" placeholder="Password" autocomplete="current-password"><br><br><button id="loginBtn" class="btn primary" style="width:100%">Sign In</button><div id="loginMsg" class="error"></div></div>
<div id="app" class="app"><header class="bar"><div class="brand">SKY<span>SHOT</span>CONNER</div><button class="btn" onclick="location.href='admin.html'">← Admin</button><button class="btn" onclick="logout()">Sign out</button></header><main class="wrap"><div class="top"><div><h1>Shop Orders</h1><p class="muted">Manage paid orders, fulfilment and delivery.</p></div><button class="btn primary" onclick="loadOrders()">↻ Refresh</button></div><section class="cards"><div class="card"><small>Total orders</small><strong id="cTotal">—</strong></div><div class="card"><small>Paid</small><strong id="cPaid">—</strong></div><div class="card"><small>Processing</small><strong id="cProcessing">—</strong></div><div class="card"><small>To ship</small><strong id="cReady">—</strong></div></section><section class="panel"><div class="toolbar"><input id="search" class="input" placeholder="Search order number, customer or email…" oninput="render()"><select id="filter" onchange="loadOrders()"><option value="ALL">All fulfilment statuses</option><option>NOT_STARTED</option><option>PROCESSING</option><option>READY</option><option>SHIPPED</option><option>DELIVERED</option><option>ON_HOLD</option><option>CANCELLED</option></select></div><div id="notice" class="notice hidden"></div><div class="table-wrap"><table class="table"><thead><tr><th>Order</th><th>Customer</th><th>Amount</th><th>Payment</th><th>Fulfilment</th><th>Date</th><th></th></tr></thead><tbody id="rows"></tbody></table></div></section></main></div>
<div id="modal" class="modal"><div class="modalbox"><div class="modalhead"><div><h2 id="mTitle">Order</h2><div id="mSub" class="muted"></div></div><button class="btn" onclick="closeModal()">×</button></div><div id="mBody" style="margin-top:18px"></div></div></div>
<script>
let orders=[];let current=null;const FN=SUPABASE_URL+'/functions/v1/admin-shop-orders';
async function session(){const {data}=await supabaseClient.auth.getSession();return data.session}
async function api(path='',options={}){const s=await session();if(!s)throw Error('Session expired.');const r=await fetch(FN+path,{...options,headers:{'Content-Type':'application/json',Authorization:'Bearer '+s.access_token,apikey:SUPABASE_KEY,...(options.headers||{})}});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Request failed');return d}
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function money(v){return 'R '+Number(v||0).toLocaleString('en-ZA',{minimumFractionDigits:2,maximumFractionDigits:2})}
function fmt(v){return v?new Date(v).toLocaleString('en-ZA',{dateStyle:'medium',timeStyle:'short'}):'—'}
function render(){const q=document.getElementById('search').value.toLowerCase();let list=orders.filter(o=>{const s=(o.order_number+' '+o.customer_first_name+' '+o.customer_last_name+' '+o.customer_email).toLowerCase();return !q||s.includes(q)});document.getElementById('rows').innerHTML=list.map(o=>`<tr><td><b>${esc(o.order_number)}</b></td><td>${esc(o.customer_first_name+' '+o.customer_last_name)}<br><small class="muted">${esc(o.customer_email)}</small></td><td>${money(o.amount)}</td><td><span class="pill ${o.status.toLowerCase()}">${esc(o.status)}</span></td><td><span class="pill fulfil">${esc(o.fulfilment_status)}</span></td><td>${fmt(o.created_at)}</td><td><button class="btn rowbtn" onclick="openOrder('${esc(o.order_number)}')">View</button></td></tr>`).join('')||'<tr><td colspan="7" class="muted">No orders found.</td></tr>'}
function counters(){document.getElementById('cTotal').textContent=orders.length;document.getElementById('cPaid').textContent=orders.filter(x=>x.status==='PAID').length;document.getElementById('cProcessing').textContent=orders.filter(x=>x.fulfilment_status==='PROCESSING').length;document.getElementById('cReady').textContent=orders.filter(x=>x.fulfilment_status==='READY').length}
async function loadOrders(){try{hideNotice();const st=document.getElementById('filter').value;const d=await api('?status='+encodeURIComponent(st));orders=d.orders||[];counters();render()}catch(e){showNotice(e.message,true)}}
async function openOrder(n){try{const d=await api('?order='+encodeURIComponent(n));current=d;const o=d.order;document.getElementById('mTitle').textContent=o.order_number;document.getElementById('mSub').textContent=o.customer_first_name+' '+o.customer_last_name+' • '+fmt(o.created_at);document.getElementById('mBody').innerHTML=`<div class="grid"><div class="field"><label>Customer email</label><div>${esc(o.customer_email)}</div></div><div class="field"><label>Phone</label><div>${esc(o.customer_phone||'—')}</div></div><div class="field"><label>Payment</label><div><span class="pill paid">${esc(o.status)}</span> ${o.payfast_payment_id?'PayFast #'+esc(o.payfast_payment_id):''}</div></div><div class="field"><label>Total</label><div>${money(o.amount)}</div></div><div class="field full"><label>Shipping address</label><div>${[o.shipping_address_line1,o.shipping_address_line2,o.shipping_suburb,o.shipping_city,o.shipping_province,o.shipping_postal_code,o.shipping_country].filter(Boolean).map(esc).join('<br>')}</div></div></div><div class="section"><h3>Items</h3><table class="items">${(d.items||[]).map(i=>`<tr><td>${esc(i.product_name)}<br><small class="muted">${esc(i.canvas_size)}</small></td><td>× ${i.quantity}</td><td>${money(i.line_total)}</td></tr>`).join('')}</table></div><div class="section"><h3>Fulfilment</h3><div class="grid"><div class="field"><label>Status</label><select id="mStatus"><option>NOT_STARTED</option><option>PROCESSING</option><option>READY</option><option>SHIPPED</option><option>DELIVERED</option><option>ON_HOLD</option><option>CANCELLED</option></select></div><div class="field"><label>Courier</label><input id="mCourier" class="input" value="${esc(o.courier||'')}"></div><div class="field"><label>Tracking number</label><input id="mTracking" class="input" value="${esc(o.tracking_number||'')}"></div><div class="field"><label>Internal notes</label><textarea id="mNotes" class="input" rows="3">${esc(o.internal_notes||'')}</textarea></div><div class="field full"><label>Status change note</label><input id="mNote" class="input" placeholder="Optional note for the order history"></div></div><div class="actions"><button class="btn" onclick="closeModal()">Close</button><button class="btn primary" onclick="saveOrder()">Save changes</button></div></div><div class="section"><h3>Status history</h3><div class="timeline">${(d.history||[]).map(h=>`<div class="event"><strong>${esc(h.new_status)} <span class="muted">(${esc(h.status_type)})</span></strong><small>${fmt(h.created_at)}${h.note?' • '+esc(h.note):''}</small></div>`).join('')||'<div class="muted">No history recorded yet.</div>'}</div></div>`;document.getElementById('mStatus').value=o.fulfilment_status;document.getElementById('modal').style.display='block'}catch(e){showNotice(e.message,true)}}
async function saveOrder(){if(!current)return;const b={order_number:current.order.order_number,fulfilment_status:document.getElementById('mStatus').value,courier:document.getElementById('mCourier').value.trim()||null,tracking_number:document.getElementById('mTracking').value.trim()||null,internal_notes:document.getElementById('mNotes').value.trim()||null,note:document.getElementById('mNote').value.trim()||null};try{await api('',{method:'POST',body:JSON.stringify(b)});closeModal();await loadOrders();showNotice('Order '+current.order.order_number+' updated successfully.')}catch(e){alert(e.message)}}
function closeModal(){document.getElementById('modal').style.display='none';current=null}function showNotice(t,error=false){const n=document.getElementById('notice');n.textContent=t;n.classList.remove('hidden');if(error)n.style.color='#ffaaaa';setTimeout(()=>n.classList.add('hidden'),5000)}function hideNotice(){document.getElementById('notice').classList.add('hidden')}
async function logout(){await supabaseClient.auth.signOut();location.reload()}
async function start(){const s=await session();if(!s){document.getElementById('login').style.display='block';document.getElementById('app').style.display='none';return}try{await api();document.getElementById('login').style.display='none';document.getElementById('app').style.display='block';await loadOrders()}catch(e){document.getElementById('loginMsg').textContent=e.message;await supabaseClient.auth.signOut()}}
document.getElementById('loginBtn').onclick=async()=>{const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;document.getElementById('loginMsg').textContent='';const {error}=await supabaseClient.auth.signInWithPassword({email,password});if(error){document.getElementById('loginMsg').textContent=error.message;return}start()};start();
</script></body></html>
