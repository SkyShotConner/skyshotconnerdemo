name: SkyShotConner Polish

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply mobile dashboard and banner polish
        shell: python
        run: |
          from pathlib import Path

          admin = Path('admin.html')
          if admin.exists():
              s = admin.read_text(encoding='utf-8')
              marker = '/* SKYSHOTCONNER MOBILE POLISH */'
              if marker not in s:
                  css = r'''<style id="skyshotconner-mobile-polish">
          /* SKYSHOTCONNER MOBILE POLISH */
          @media (max-width:720px){
            html,body{width:100%;overflow-x:hidden}
            .side{box-shadow:0 10px 30px rgba(0,0,0,.25)}
            .side.open{overflow-y:auto}
            .main{padding-left:10px;padding-right:10px}
            .top{gap:8px;flex-wrap:wrap}
            .top>div:first-child{min-width:0;flex:1}
            .top h1{font-size:1.55rem;line-height:1.1}
            .status{padding-top:4px}
            .cards{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
            .card{min-width:0;padding:12px}
            .card strong{font-size:21px;line-height:1.1}
            .card em{font-size:9px;line-height:1.2}
            .panel{padding:13px;margin-top:10px;overflow:hidden}
            .panel-head{gap:8px;flex-wrap:wrap}
            .panel-head h2{font-size:15px}
            .quick-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
            .quick{padding:12px 10px;min-width:0}
            .quick strong{font-size:12px}
            .quick .muted{font-size:10px;line-height:1.25}
            .toolbar{display:grid;grid-template-columns:1fr;gap:7px}
            .toolbar .btn{width:100%}
            .table-wrap{margin:0 -13px;padding:0 13px}
            .table{min-width:600px}
            .modal{padding:0;align-items:flex-end}
            .modalbox{width:100%;max-height:94dvh;margin:0;border-radius:18px 18px 0 0;padding:14px;overflow:auto}
            .form{gap:10px}
            .form input,.form textarea,.form select{font-size:16px}
            .actions{position:sticky;bottom:0;margin:14px -14px -14px;padding:12px 14px;background:linear-gradient(180deg,rgba(14,21,29,.92),#0e151d);z-index:2}
            .actions .btn{flex:1}
            #phoenixTools{z-index:100;right:8px;top:62px;width:calc(100vw - 16px);max-height:calc(100dvh - 72px);border-radius:15px}
            .phoenix-panel{z-index:101}
          }
          @media (max-width:390px){
            .main{padding-left:8px;padding-right:8px}
            .cards{gap:6px}
            .card{padding:10px}
            .card strong{font-size:19px}
            .quick{padding:10px 8px}
          }
          </style>'''
                  s = s.replace('</head>', css + '\n</head>', 1)
                  admin.write_text(s, encoding='utf-8')

          cfg = Path('supabase-config.js')
          if cfg.exists():
              s = cfg.read_text(encoding='utf-8')
              import re
              s2 = re.sub(r'\n\s*addConstructionBanner\(\);', '', s, count=1)
              if s2 == s and 'siteConstructionBanner' in s:
                  s2 = s.replace('function addConstructionBanner(){', 'function addConstructionBanner(){\n        return; // Construction banner retired.', 1)
              cfg.write_text(s2, encoding='utf-8')
      - name: Commit polish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin.html supabase-config.js
          git diff --cached --quiet || git commit -m "Polish admin mobile layout and remove construction banner"
          git push
